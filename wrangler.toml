name = "compost"
main = "src/worker.js"
compatibility_date = "2026-10-01"

# Static files in ./public are served directly. Anything that doesn't match a
# file (the /api/* routes) falls through to the Worker.
[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "compost"
# Paste the id printed by `npx wrangler d1 create compost`.
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"
